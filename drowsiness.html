<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cảnh báo buồn ngủ khi lái xe</title>
<style>
  :root { --bg:#111; --fg:#eee; --card:#1d1d1d; --red:#ff3b30; --accent:#4cc38a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f4f4; --fg:#111; --card:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--fg);
         display:flex; flex-direction:column; align-items:center; padding:16px; gap:12px; }
  h1 { font-size:1.2rem; margin:0; }
  #stage { position:relative; width:100%; max-width:820px; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; }
  #stage.alarm { outline:6px solid var(--red); }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  #alerts { position:absolute; left:12px; top:12px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  .alert { background:rgba(255,59,48,.9); color:#fff; font-weight:700; padding:6px 12px; border-radius:8px; font-size:1.1rem; }
  #info { position:absolute; right:10px; bottom:10px; z-index:2; background:rgba(0,0,0,.6); color:#fff;
          font:12px/1.5 ui-monospace, Consolas, monospace; padding:6px 10px; border-radius:8px; display:none; }
  #msg { position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; text-align:center;
         color:#fff; padding:20px; background:rgba(0,0,0,.55); }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:0; background:var(--accent); color:#000; font-weight:600; cursor:pointer; }
  button.secondary { background:var(--card); color:var(--fg); border:1px solid #888; }
  label { display:flex; gap:6px; align-items:center; }
  small { opacity:.7; max-width:820px; text-align:center; }
</style>
</head>
<body>
<h1>Cảnh báo buồn ngủ khi lái xe</h1>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="alerts"></div>
  <div id="info"></div>
  <div id="msg">Nhấn "Bắt đầu" và cho phép truy cập camera.</div>
</div>

<div class="row">
  <button id="start">Bắt đầu</button>
  <label><input type="checkbox" id="debug"> Hiện điểm & số liệu</label>
  <label><input type="checkbox" id="sound" checked> Bật còi</label>
</div>
<small>Mọi xử lý chạy ngay trong trình duyệt, hình ảnh camera không được gửi đi đâu.</small>

<script type="module">
import { FaceLandmarker, FilesetResolver }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm";

// ======================= CẤU HÌNH (chỉnh ngưỡng ở đây) =======================
const CFG = {
  EYE_BLINK_THRESH: 0.45,   // điểm eyeBlink trung bình phải > ngưỡng này
  EYE_AR_THRESH: 0.25,      // VÀ EAR phải < ngưỡng này
  EYE_CLOSED_SEC: 0.8,
  MOUTH_AR_THRESH: 0.60,
  YAWN_SEC: 1.0,
  HEAD_NOD_DEG: 20,
  HEAD_NOD_SEC: 1.5,
  SIREN_LOW: 640, SIREN_HIGH: 900, SIREN_BEAT_MS: 400,
};
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const WASM_URL  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm";

const RIGHT_EYE = [33, 160, 158, 133, 153, 144];
const LEFT_EYE  = [263, 387, 385, 362, 373, 380];
const MOUTH     = [78, 81, 13, 308, 14, 87];

const $ = id => document.getElementById(id);
const video = $("video"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const stage = $("stage"), alertsEl = $("alerts"), infoEl = $("info"), msg = $("msg");

// ============================== CÒI "ò e ò e" ===============================
let audioCtx = null, osc = null, gain = null, sirenTimer = null, sirenOn = false;
function sirenStart() {
  if (sirenOn || !$("sound").checked) return;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  osc = audioCtx.createOscillator(); gain = audioCtx.createGain();
  osc.type = "sine"; gain.gain.value = 0.35;
  osc.connect(gain).connect(audioCtx.destination); osc.start();
  let high = false;
  const tick = () => { osc.frequency.setValueAtTime(high ? CFG.SIREN_HIGH : CFG.SIREN_LOW, audioCtx.currentTime); high = !high; };
  tick(); sirenTimer = setInterval(tick, CFG.SIREN_BEAT_MS);
  sirenOn = true;
}
function sirenStop() {
  if (!sirenOn) return;
  clearInterval(sirenTimer); osc.stop(); osc.disconnect(); gain.disconnect();
  sirenOn = false;
}

// =============================== TIỆN ÍCH ====================================
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function ratio(lm, idx, w, h) {
  const p = idx.map(i => ({ x: lm[i].x * w, y: lm[i].y * h }));
  return ((dist(p[1], p[5]) + dist(p[2], p[4])) / (2 * dist(p[0], p[3]) + 1e-6));
}
// Góc cúi/ngửa (pitch) từ ma trận biến đổi 4x4 (column-major) của MediaPipe
function pitchFromMatrix(m) {
  const r21 = m[6], r22 = m[10];            // R[2][1], R[2][2]
  return Math.atan2(r21, r22) * 180 / Math.PI;
}
const now = () => performance.now() / 1000;

// Mỗi trạng thái: thời điểm bắt đầu (null = không xảy ra)
const st = { eye: null, eyeOpenSince: null, yawn: null, nod: null, noFaceSince: null };
const dur = t => (t == null ? 0 : now() - t);

// =============================== VÒNG LẶP ====================================
let landmarker = null, lastVideoTime = -1, lastAlertTime = 0;

function showAlerts(list) {
  alertsEl.innerHTML = list.map(t => `<div class="alert">${t}</div>`).join("");
  stage.classList.toggle("alarm", list.length > 0);
  const t = now();
  if (list.length) { lastAlertTime = t; sirenStart(); }
  else if (t - lastAlertTime > 0.6) sirenStop();
}

function drawDebug(lm, w, h) {
  ctx.fillStyle = "rgba(255,0,0,.8)";
  for (let i = 0; i < lm.length; i += 7) { ctx.fillRect(lm[i].x * w - 1, lm[i].y * h - 1, 2, 2); }
  ctx.strokeStyle = "#4cc38a"; ctx.lineWidth = 1.5;
  for (const idx of [LEFT_EYE, RIGHT_EYE, MOUTH]) {
    ctx.beginPath();
    idx.forEach((i, k) => k ? ctx.lineTo(lm[i].x * w, lm[i].y * h) : ctx.moveTo(lm[i].x * w, lm[i].y * h));
    ctx.closePath(); ctx.stroke();
  }
}

function loop() {
  requestAnimationFrame(loop);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  const w = video.videoWidth, h = video.videoHeight;
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; }
  ctx.clearRect(0, 0, w, h);

  const res = landmarker.detectForVideo(video, performance.now());
  const alerts = [];
  const debug = $("debug").checked;
  const t = now();

  if (res.faceLandmarks && res.faceLandmarks.length) {
    const lm = res.faceLandmarks[0];
    st.noFaceSince = null;

    // ---- 1. Mắt: blendshape + EAR ----
    const ear = (ratio(lm, LEFT_EYE, w, h) + ratio(lm, RIGHT_EYE, w, h)) / 2;
    let blink = null;
    if (res.faceBlendshapes && res.faceBlendshapes.length) {
      const sc = {};
      res.faceBlendshapes[0].categories.forEach(c => sc[c.categoryName] = c.score);
      blink = ((sc.eyeBlinkLeft || 0) + (sc.eyeBlinkRight || 0)) / 2;
    }
    const closed = blink !== null ? (blink > CFG.EYE_BLINK_THRESH && ear < CFG.EYE_AR_THRESH)
                                  : ear < CFG.EYE_AR_THRESH;
    if (closed) { if (st.eye == null) st.eye = t; st.eyeOpenSince = null; }
    else {
      if (st.eyeOpenSince == null) st.eyeOpenSince = t;
      if (t - st.eyeOpenSince > 0.3) st.eye = null;     // cho phép nhiễu 0.3s
    }
    if (dur(st.eye) >= CFG.EYE_CLOSED_SEC) alerts.push("BUỒN NGỦ: Đang nhắm mắt!");

    // ---- 2. Ngáp (MAR) ----
    const mar = ratio(lm, MOUTH, w, h);
    if (mar > CFG.MOUTH_AR_THRESH) { if (st.yawn == null) st.yawn = t; } else st.yawn = null;
    if (dur(st.yawn) >= CFG.YAWN_SEC) alerts.push("Đang ngáp!");

    // ---- 3. Gục / ngửa đầu ----
    let pitch = null;
    if (res.facialTransformationMatrixes && res.facialTransformationMatrixes.length) {
      pitch = pitchFromMatrix(res.facialTransformationMatrixes[0].data);
      if (Math.abs(pitch) > CFG.HEAD_NOD_DEG) { if (st.nod == null) st.nod = t; } else st.nod = null;
      if (dur(st.nod) >= CFG.HEAD_NOD_SEC) alerts.push("BUỒN NGỦ: Gục đầu!");
    }

    if (debug) {
      drawDebug(lm, w, h);
      infoEl.textContent = `EAR ${ear.toFixed(2)} | Blink ${blink === null ? "-" : blink.toFixed(2)} | ` +
        `MAR ${mar.toFixed(2)} | Góc đầu ${pitch === null ? "-" : pitch.toFixed(1)} | Nhắm ${dur(st.eye).toFixed(1)}s`;
    }
  } else {
    // Mất mặt: giữ bộ đếm mắt tối đa 3s (nhắm chặt mắt đôi khi làm mất mặt)
    if (st.noFaceSince == null) st.noFaceSince = t;
    st.yawn = st.nod = null;
    if (st.eye != null && t - st.noFaceSince < 3) {
      if (dur(st.eye) >= CFG.EYE_CLOSED_SEC) alerts.push("BUỒN NGỦ: Đang nhắm mắt!");
    } else st.eye = null;
    if (debug) infoEl.textContent = "Không thấy khuôn mặt";
  }

  infoEl.style.display = debug ? "block" : "none";
  showAlerts(alerts);
}

// =============================== KHỞI ĐỘNG ===================================
$("sound").addEventListener("change", e => { if (!e.target.checked) sirenStop(); });

$("start").addEventListener("click", async () => {
  $("start").disabled = true;
  try {
    // Tạo AudioContext ngay trong lúc người dùng bấm nút (trình duyệt yêu cầu)
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();

    msg.textContent = "Đang tải mô hình AI...";
    const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: MODEL_URL, delegate },
      runningMode: "VIDEO", numFaces: 1,
      outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true,
    });
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU")); }
    catch { landmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU")); }

    msg.textContent = "Đang mở camera...";
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 960, height: 720, facingMode: "user" }, audio: false });
    await video.play();
    msg.style.display = "none";
    $("start").textContent = "Đang chạy";
    loop();
  } catch (err) {
    console.error(err);
    msg.style.display = "flex";
    msg.textContent = "Lỗi: " + (err.message || err) +
      " — Hãy mở trang qua http://localhost (không mở trực tiếp file) và cho phép camera.";
    $("start").disabled = false;
  }
});
</script>
</body>
</html>
